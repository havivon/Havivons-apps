<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>האפליקציות של Havivon</title>
  <meta name="theme-color" content="#e8552f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e8552f'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='bold' font-size='36' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
</head>
<body data-page="app" class="min-h-screen antialiased">
  <header class="sticky top-0 z-30 backdrop-blur-md border-b line" style="background:color-mix(in srgb, var(--bg) 82%, transparent)">
    <nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="./" class="flex items-center gap-2.5 font-display font-bold text-lg">
        <span class="grid place-items-center w-9 h-9 rounded-xl bg-accent text-base">H</span>
        <span>Havivon<span class="muted font-medium"> · אפליקציות</span></span>
      </a>
      <div class="flex items-center gap-2">
        <a href="./#apps" class="btn btn-ghost"><i data-lucide="arrow-right"></i><span class="hidden sm:inline">כל האפליקציות</span></a>
        <button type="button" data-theme-toggle class="btn btn-ghost !px-3" aria-label="החלפת מצב כהה/בהיר"><i data-lucide="sun-moon"></i></button>
      </div>
    </nav>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 py-8 sm:py-12">
    <div class="py-24 text-center muted">טוען…</div>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="צילום מסך מוגדל">
    <div class="relative flex flex-col items-center gap-3">
      <img src="" alt="">
      <div class="flex gap-2">
        <button type="button" data-next class="btn btn-ghost !text-white !border-white/20" aria-label="הקודם"><i data-lucide="chevron-right"></i></button>
        <button type="button" data-close class="btn btn-ghost !text-white !border-white/20" aria-label="סגירה"><i data-lucide="x"></i></button>
        <button type="button" data-prev class="btn btn-ghost !text-white !border-white/20" aria-label="הבא"><i data-lucide="chevron-left"></i></button>
      </div>
    </div>
  </dialog>

  <footer class="border-t line mt-8">
    <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col sm:flex-row gap-3 items-center justify-between text-sm muted">
      <p>Created By <span class="font-display font-semibold accent">Havivon</span> · <span data-year></span></p>
      <a href="./" class="hover:underline">כל האפליקציות</a>
    </div>
  </footer>
</body>
</html>
